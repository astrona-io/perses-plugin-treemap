name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PERCLI_VERSION: 0.55.1
  PERCLI_SHA256: 7c38ace5ce665e22d7d4f823b8bc0c8e91f9bcef381f218d8c564e0fe62ba750
  CUE_VERSION: v0.17.1
  CUE_SHA256: a39b0c97695069d95d276d99be0f5dbabb081d801bfdc9ba49b76efaf94e2369

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install percli and cue
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/tools"
          curl -fsSLo perses.tar.gz "https://github.com/perses/perses/releases/download/v${PERCLI_VERSION}/perses_${PERCLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo cue.tar.gz "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz"
          printf '%s  perses.tar.gz\n%s  cue.tar.gz\n' "$PERCLI_SHA256" "$CUE_SHA256" | sha256sum --check
          tar -xzf perses.tar.gz -C "$RUNNER_TEMP/bin" percli
          tar -xzf cue.tar.gz -C "$RUNNER_TEMP/bin" cue
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: cue mod tidy --check
      - run: percli plugin test-schemas
      - run: npm run build
      - run: percli plugin build
