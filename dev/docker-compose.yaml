# A local Perses with the plugin and made-up OpenCost-style cost data to draw.
# See "Try it locally" in the README.
name: perses-plugin-treemap

services:
  fake-metrics:
    image: docker.io/library/python:3.13-alpine
    command: ["python", "/app/fake_metrics.py"]
    volumes:
      - ./fake_metrics.py:/app/fake_metrics.py:ro,z

  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    depends_on: [fake-metrics]

  perses:
    image: docker.io/persesdev/perses:v0.55.1
    command: ["--config", "/etc/perses/config.yaml"]
    ports:
      - "127.0.0.1:${PERSES_PORT:-18082}:8080"
    volumes:
      - ./perses.yaml:/etc/perses/config.yaml:ro,z
      - ./provisioning:/etc/perses/provisioning:ro,z
      - ./dashboards:/etc/perses/dashboards:ro,z
      # Holds Treemap-<version>.tar.gz from `percli plugin build`.
      - ./archive:/etc/perses/plugins-archive-treemap:ro,z
    depends_on: [prometheus]
